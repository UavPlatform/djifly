# OpenAPI 契约自动同步（由后端仓库 repository_dispatch 触发、每日定时巡检、手动触发）
#
# 后端（UavPlatform/backend）契约变更时发布 Release contract-<shortsha>，
# 附件 drone-backend.openapi.json + .sha256，并 dispatch `openapi-updated` 事件。
#
# 本 workflow：下载契约、校验 sha256、运行 tools/openapi-sync.mjs + tools/openapi-gen.mjs，
# 若有变更则在固定分支 bot/openapi-sync 开或更新 PR（目标 master）。
#
# ADR 原则：取代旧的「vendor + 手动同步」策略，改为机器人自动开 PR。
# 参考文档：UavPlatform/docs 仓库 ADR（后端发布 + 机器人 PR）。
name: OpenAPI Contract Sync

on:
  repository_dispatch:
    types: [openapi-updated]
  schedule:
    # 每日 UTC 02:00 巡检（北京时间 10:00）
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: "强制更新（即使契约未变化）"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: 同步 OpenAPI 契约
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 生成 GitHub App token（若配置了则使用，可触发 CI）
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CONTRACT_BOT_APP_ID }}
          private-key: ${{ secrets.CONTRACT_BOT_PRIVATE_KEY }}
        continue-on-error: true

      - name: Checkout 仓库
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 下载最新契约（优先 Release，回退后端 main）
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_SHA256: ${{ github.event.client_payload.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/contract
          echo "开始下载 OpenAPI 契约..."

          # 有 dispatch payload 时按 payload 取同一份契约，避免与 schedule 抢「最新」。
          TAG="$DISPATCH_TAG"
          SHA256="$DISPATCH_SHA256"

          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo UavPlatform/backend --limit 30 \
              --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease == false) | .tagName | select(startswith("contract-"))] | first // ""')
          fi

          if [ -n "$TAG" ]; then
            echo "下载 Release 资产：$TAG"
            # 走 GitHub API 而不是匿名 releases/download（后者 302 到 CDN，实测长期 504）。
            gh release download "$TAG" \
              --repo UavPlatform/backend \
              --pattern "drone-backend.openapi.json" \
              --pattern "*.sha256" \
              --dir /tmp/contract \
              --clobber

            if [ -z "$SHA256" ]; then
              for candidate in /tmp/contract/drone-backend.openapi.json.sha256 /tmp/contract/drone-backend.openapi.sha256; do
                if [ -f "$candidate" ]; then
                  SHA256=$(awk '{print $1}' "$candidate")
                  break
                fi
              done
            fi

            echo "source=release" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "未找到 contract-* Release，回退到后端 main 分支"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3.raw" \
              -o /tmp/contract/drone-backend.openapi.json \
              "https://api.github.com/repos/UavPlatform/backend/contents/spec/openapi/drone-backend.openapi.json?ref=main"
            SHA256=$(sha256sum /tmp/contract/drone-backend.openapi.json | awk '{print $1}')
            COMMIT=$(gh api repos/UavPlatform/backend/commits/main --jq '.sha[:7]')
            echo "source=main" >> "$GITHUB_OUTPUT"
            echo "tag=main@$COMMIT" >> "$GITHUB_OUTPUT"
          fi

          ACTUAL_SHA256=$(sha256sum /tmp/contract/drone-backend.openapi.json | awk '{print $1}')
          # sha256 不符是真失败：拿到的不是被发布的那份契约，后续生成没有意义。
          if [ -n "$SHA256" ] && [ "$SHA256" != "$ACTUAL_SHA256" ]; then
            echo "::error::SHA256 校验失败（预期 $SHA256，实际 $ACTUAL_SHA256）"
            exit 1
          fi
          echo "sha256=$ACTUAL_SHA256" >> "$GITHUB_OUTPUT"
          echo "sha256: $ACTUAL_SHA256"

      - name: 同步契约到 openapi/ 目录
        env:
          OPENAPI_SOURCE: /tmp/contract/drone-backend.openapi.json
        run: |
          set -e
          echo "运行 tools/openapi-sync.mjs..."
          node tools/openapi-sync.mjs

      # 生成器对「登记过但新契约已删除」的调用点只跳过并汇总（见 tools/openapi-gen.mjs），
      # 因此生成失败只意味着生成器自身或契约坏了，而不是本端业务代码还没适配。
      - name: 生成契约代码
        id: generate
        run: |
          set -e
          echo "运行 tools/openapi-gen.mjs..."
          node tools/openapi-gen.mjs --report "$RUNNER_TEMP/worklist.md"

          if git diff --quiet openapi/ app/src/main/java/com/fuwaki/djifly/platform/network/generated/; then
            echo "契约未变化，无需更新 PR"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "契约已变化，准备更新 PR"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 汇总待适配调用点
        id: worklist
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/worklist.md" ]; then
            {
              echo 'worklist<<EOF'
              cat "$RUNNER_TEMP/worklist.md"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'worklist<<EOF' >> "$GITHUB_OUTPUT"
            echo '无。' >> "$GITHUB_OUTPUT"
            echo 'EOF' >> "$GITHUB_OUTPUT"
          fi

      - name: 检查生成物形状
        if: steps.generate.outputs.has_changes == 'true'
        run: |
          set -e
          # 仅校验生成器自身的产出形状（不需要 Gradle / DJI 依赖）。
          # 注意：这里不跑 `--check`——登记表尚未适配时它必然失败，硬门禁在 master 的 CI。
          for file in app/src/main/java/com/fuwaki/djifly/platform/network/generated/*.kt; do
            if [ -f "$file" ]; then
              echo "  检查 $file"
              if ! grep -q "^package com.fuwaki.djifly.platform.network.generated" "$file"; then
                echo "::error::$file 缺少正确的 package 声明"
                exit 1
              fi
            fi
          done
          echo "✓ 生成物形状检查通过"

      - name: 创建或更新 PR
        if: steps.generate.outputs.has_changes == 'true' || github.event.inputs.force_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch: bot/openapi-sync
          delete-branch: false
          base: master
          commit-message: |
            chore: 同步 OpenAPI 契约 ${{ steps.download.outputs.tag }}
            
            来源：${{ steps.download.outputs.source }}
            SHA256：${{ steps.download.outputs.sha256 }}
          title: "🤖 同步 OpenAPI 契约 ${{ steps.download.outputs.tag }}"
          body: |
            ## 🔄 OpenAPI 契约自动同步
            
            本 PR 由机器人自动生成，同步后端 OpenAPI 契约到本仓库。
            
            ### 契约信息
            
            - **来源**：${{ steps.download.outputs.source == 'release' && 'Release' || '后端 main 分支' }}
            - **标签/版本**：`${{ steps.download.outputs.tag }}`
            - **SHA256**：`${{ steps.download.outputs.sha256 }}`
            
            ### 变更内容
            
            - 更新 `openapi/drone-backend.openapi.json`
            - 更新 `openapi/drone-backend.openapi.sha256`
            - 重新生成 `app/src/main/java/com/fuwaki/djifly/platform/network/generated/ApiPaths.kt`
            - 重新生成 `app/src/main/java/com/fuwaki/djifly/platform/network/generated/ApiModels.kt`

            ### 待适配清单（本 PR 内处理）

            ${{ steps.worklist.outputs.worklist }}

            > 本 PR 只保证契约与生成物同源；业务适配（更新 `calledEndpoints`、改调用点）在本 PR 内完成。
            > `master` 的 CI（`node tools/openapi-gen.mjs --check` + Gradle 单测）是最终门禁。

            ### 审核要点

            1. ✅ 检查生成的 Kotlin 代码是否符合预期
            2. ✅ 确认现有调用点（`PlatformApiService`）是否需要适配
            3. ✅ 评审 API 变更的影响范围
            4. ✅ CI 检查是否全部通过
            
            ---
            
            📚 **相关文档**：参见 UavPlatform/docs 仓库 ADR（OpenAPI 契约同步策略）
            🤖 **触发方式**：${{ github.event_name == 'repository_dispatch' && 'repository_dispatch (后端发布)' || github.event_name == 'schedule' && '定时任务' || '手动触发' }}
          labels: |
            bot
            openapi
            dependencies

      - name: 提示 token 配置（若使用 GITHUB_TOKEN）
        if: steps.app-token.outcome == 'skipped' && steps.generate.outputs.has_changes == 'true'
        run: |
          echo "::notice::当前使用 GITHUB_TOKEN，PR 不会自动触发 CI。"
          echo "::notice::建议配置 GitHub App：设置 secrets.CONTRACT_BOT_APP_ID 和 secrets.CONTRACT_BOT_PRIVATE_KEY"
